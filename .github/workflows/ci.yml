name: Catalog CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test protocol, artifact safety, and publication boundaries
        run: |
          npm ci --ignore-scripts
          go test ./... -count=1
          node --test scripts/*.test.mjs
      - name: Validate reviewed recipes and independent root chain
        run: go run ./cmd/catalog-check --catalog catalog/catalog.json --root-directory catalog/trust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/vastora
          ref: 270e92cc90a4d095dd4db245ec9e83bd7101688a
          path: vastora-v3-consumer
          persist-credentials: false
      - name: Validate production recipe with the deployed schema 3 consumer
        run: |
          (cd vastora-v3-consumer && GOWORK=off go build -o "$RUNNER_TEMP/vastora-v3-catalog-check" ./cmd/catalog-check)
          "$RUNNER_TEMP/vastora-v3-catalog-check" --catalog catalog/catalog-v3.json --root-directory catalog/trust
