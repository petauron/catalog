name: Publish independent application catalog
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Publish a verified release, reviewed recipe change, or run auto-reconcile
        type: choice
        options: [release, reviewed, reconcile]
        default: release
      application:
        description: Reviewed source identifier (release only)
        type: string
      tag:
        description: Published source tag (release only)
        type: string
      sha:
        description: Exact published source commit (release only)
        type: string
      run_id:
        description: Successful source release publishing run (release only)
        type: string
  repository_dispatch:
    types: [catalog-reconcile]
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: official-catalog-stable
  queue: max
  cancel-in-progress: false
jobs:
  discover:
    name: Discover pending catalog publication
    if: >-
      github.repository == 'petauron/catalog' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.kind == 'reconcile')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub hides draft releases under contents:read; write is needed strictly to
    # detect pending draft catalog-rN releases fail-closed before entering catalog-signing.
    permissions:
      contents: write
      actions: read
    outputs:
      should_publish: ${{ steps.reconcile.outputs.should_publish }}
      kind: ${{ steps.reconcile.outputs.kind }}
      application: ${{ steps.reconcile.outputs.application }}
      tag: ${{ steps.reconcile.outputs.tag }}
      sha: ${{ steps.reconcile.outputs.sha }}
      run_id: ${{ steps.reconcile.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reconcile reviewed upstream release sources
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_AUTOPUBLISH_DISABLED: ${{ vars.CATALOG_AUTOPUBLISH_DISABLED }}
        run: |
          npm ci --ignore-scripts
          node scripts/catalog-reconcile.mjs
  mirror-glivela:
    needs: [discover]
    if: >-
      !cancelled() &&
      github.repository == 'petauron/catalog' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.kind == 'release' && inputs.application == 'glivela' && needs.discover.result == 'skipped') ||
       (needs.discover.result == 'success' && needs.discover.outputs.should_publish == 'true' && needs.discover.outputs.kind == 'release' && needs.discover.outputs.application == 'glivela'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: catalog-signing
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    env:
      CATALOG_PRODUCTION_ENABLED: ${{ vars.CATALOG_PRODUCTION_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit cutover and protected noninteractive signing environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CATALOG_PRODUCTION_ENABLED" = true
          jq -e '.publisherCutoverCompleted and .oldWriterDisabled and .consumerCompatibilityVerified' catalog/migration.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/environments/catalog-signing" |
            jq -e '.deployment_branch_policy.protected_branches == true and ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length == 0)' >/dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify attested Glivela release and stage native bundles before storage credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SOURCE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.tag || needs.discover.outputs.tag }}
          CATALOG_SOURCE_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.sha || needs.discover.outputs.sha }}
          CATALOG_SOURCE_RUN_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.run_id || needs.discover.outputs.run_id }}
        run: |
          npm ci --ignore-scripts
          node --test scripts/release-source.test.mjs scripts/mirror-glivela-native.test.mjs
          node scripts/stage-glivela-native.mjs "$RUNNER_TEMP/glivela-native-mirror"
      - name: Copy immutable bytes and verify official public origin
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET_NAME: ${{ vars.CATALOG_R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ vars.CATALOG_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: node scripts/mirror-glivela-native.mjs "$RUNNER_TEMP/glivela-native-mirror"
      - name: Remove temporary distributions
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/glivela-native-mirror"
  mirror-senlun:
    needs: [discover]
    if: >-
      !cancelled() &&
      github.repository == 'petauron/catalog' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.kind == 'release' && inputs.application == 'senlun' && needs.discover.result == 'skipped') ||
       (needs.discover.result == 'success' && needs.discover.outputs.should_publish == 'true' && needs.discover.outputs.kind == 'release' && needs.discover.outputs.application == 'senlun'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: catalog-signing
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    env:
      CATALOG_PRODUCTION_ENABLED: ${{ vars.CATALOG_PRODUCTION_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit cutover and protected noninteractive signing environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CATALOG_PRODUCTION_ENABLED" = true
          jq -e '.publisherCutoverCompleted and .oldWriterDisabled and .consumerCompatibilityVerified' catalog/migration.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/environments/catalog-signing" |
            jq -e '.deployment_branch_policy.protected_branches == true and ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length == 0)' >/dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify attested Senlun release and stage native bundles before storage credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SOURCE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.tag || needs.discover.outputs.tag }}
          CATALOG_SOURCE_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.sha || needs.discover.outputs.sha }}
          CATALOG_SOURCE_RUN_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.run_id || needs.discover.outputs.run_id }}
        run: |
          npm ci --ignore-scripts
          node --test scripts/release-source.test.mjs scripts/mirror-glivela-native.test.mjs
          node scripts/stage-senlun-native.mjs "$RUNNER_TEMP/senlun-native-mirror"
      - name: Copy immutable bytes and verify official public origin
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET_NAME: ${{ vars.CATALOG_R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ vars.CATALOG_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: node scripts/mirror-glivela-native.mjs "$RUNNER_TEMP/senlun-native-mirror"
      - name: Remove temporary distributions
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/senlun-native-mirror"
  publish:
    needs: [discover, mirror-glivela, mirror-senlun]
    # Explicit !cancelled() is required so a skipped discover or mirror job
    # does not cause implicit success() to skip publish.
    if: >-
      !cancelled() &&
      github.repository == 'petauron/catalog' &&
      github.ref == 'refs/heads/main' &&
      (needs.mirror-glivela.result == 'success' || needs.mirror-glivela.result == 'skipped') &&
      (needs.mirror-senlun.result == 'success' || needs.mirror-senlun.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile' && needs.discover.result == 'skipped') ||
       (needs.discover.result == 'success' && needs.discover.outputs.should_publish == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: catalog-signing
    permissions:
      contents: write
      actions: read
      attestations: read
      packages: read
    env:
      CATALOG_PRODUCTION_ENABLED: ${{ vars.CATALOG_PRODUCTION_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit cutover and protected noninteractive signing environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CATALOG_PRODUCTION_ENABLED" = true
          jq -e '.publisherCutoverCompleted and .oldWriterDisabled and .consumerCompatibilityVerified' catalog/migration.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/environments/catalog-signing" |
            jq -e '.deployment_branch_policy.protected_branches == true and ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length == 0)' >/dev/null
      - name: Select isolated runner workspace
        run: |
          echo "CATALOG_WORK=$RUNNER_TEMP/catalog-request" >> "$GITHUB_ENV"
          echo "CATALOG_BIN=$RUNNER_TEMP/catalog-bin" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test and build from the protected catalog commit
        run: |
          npm ci --ignore-scripts
          go test ./... -count=1
          node --test scripts/*.test.mjs
          mkdir -m 700 "$CATALOG_BIN"
          go build -o "$CATALOG_BIN/catalog-check" ./cmd/catalog-check
          go build -o "$CATALOG_BIN/catalog-publish" ./cmd/catalog-publish
          go build -o "$CATALOG_BIN/catalog-verify" ./cmd/catalog-verify
      - name: Warn before offline root rotation is required
        run: node scripts/root-expiry.mjs
      # discover is skipped on manual release/reviewed workflow_dispatch (so needs.discover.outputs.*
      # are empty), making the ternary fallback exact even for empty manual inputs (e.g. kind=reviewed).
      - name: Resolve source, verify artifacts, and allocate a durable revision
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RECONCILED: ${{ needs.discover.result == 'success' }}
          CATALOG_REQUEST_KIND: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.kind || needs.discover.outputs.kind }}
          CATALOG_APPLICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.application || needs.discover.outputs.application }}
          CATALOG_SOURCE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.tag || needs.discover.outputs.tag }}
          CATALOG_SOURCE_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.sha || needs.discover.outputs.sha }}
          CATALOG_SOURCE_RUN_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.kind != 'reconcile') && inputs.run_id || needs.discover.outputs.run_id }}
        run: node scripts/catalog-plan.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.prepare.outputs.publish == 'true'
        with:
          repository: petauron/glivela
          ref: ${{ steps.prepare.outputs.glivela_ui_ref }}
          path: meridian-ui
          persist-credentials: false
      - name: Build independent Glivela UI without publication credentials
        if: steps.prepare.outputs.publish == 'true'
        env:
          GLIVELA_UI_REF: ${{ steps.prepare.outputs.glivela_ui_ref }}
          GLIVELA_UI_JS_SHA256: ${{ steps.prepare.outputs.glivela_ui_js_sha256 }}
          GLIVELA_UI_CSS_SHA256: ${{ steps.prepare.outputs.glivela_ui_css_sha256 }}
        run: |
          test "$(git -C meridian-ui rev-parse HEAD)" = "$GLIVELA_UI_REF"
          npm ci --prefix meridian-ui/ui
          npm run check --prefix meridian-ui/ui
          npm test --prefix meridian-ui/ui
          npm run build --prefix meridian-ui/ui
          version="$(jq -r '.apps[] | select(.id == "meridian") | .version' "$CATALOG_WORK/candidate.json")"
          script="meridian-ui/ui/dist/ui-glivela-$version.js"
          style="meridian-ui/ui/dist/ui-glivela-$version.css"
          test -s "$script" && test -s "$style"
          test "$(wc -c < "$script")" -le 4194304
          test "$(wc -c < "$style")" -le 4194304
          if [ -n "$GLIVELA_UI_JS_SHA256" ]; then
            printf '%s  %s\n' "$GLIVELA_UI_JS_SHA256" "$script" | sha256sum --check --status
          fi
          if [ -n "$GLIVELA_UI_CSS_SHA256" ]; then
            printf '%s  %s\n' "$GLIVELA_UI_CSS_SHA256" "$style" | sha256sum --check --status
          fi
          echo "CATALOG_UI_BUNDLE=$GITHUB_WORKSPACE/$script" >> "$GITHUB_ENV"
          echo "CATALOG_UI_STYLE=$GITHUB_WORKSPACE/$style" >> "$GITHUB_ENV"
      - name: Sign online roles, persist exact bytes, CAS activate, and verify public catalog
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SIGNERS: ${{ secrets.CATALOG_SIGNERS }}
          CATALOG_KEY_DIRECTORY: ${{ runner.temp }}/catalog-signers
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET_NAME: ${{ vars.CATALOG_R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ vars.CATALOG_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: node scripts/catalog-signing-job.mjs
      - name: Record actionable failure without exposing credentials
        if: failure()
        run: |
          echo '::error::Catalog publication was not confirmed. Preserve drafts and check migration/source/expiry gates. Do not reset trust or overwrite timestamp.'
          echo 'Catalog publication blocked or failed. Review this run and the pending release ledger before any retry.' >> "$GITHUB_STEP_SUMMARY"
